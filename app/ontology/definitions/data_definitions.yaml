# 数据本体：统一指标口径

metrics:
  GMV:
    chinese_name: 成交总额
    definition: "支付订单金额总和，含退货订单"
    formula: "SUM(order_amount) WHERE status IN ('paid', 'refunded')"
    data_source: order_db.orders
    dimensions: [渠道, 产品, 日期, 地区]

  净销售额:
    chinese_name: 净销售额
    definition: "GMV 减去退货金额"
    formula: "GMV - SUM(refund_amount)"

  ROI:
    chinese_name: 投入产出比
    definition: "GMV 除以投放花费"
    formula: "GMV / ad_spend"
    warning: "不同渠道的 ad_spend 统计口径不同"

  GPM:
    chinese_name: 千次曝光成交额
    definition: "GMV / 曝光次数 * 1000"
    formula: "GMV / impressions * 1000"
    applicable_channels: [抖音, 小红书]

  转化率:
    chinese_name: 转化率
    definition: "下单人数 / 访客人数"
    formula: "buyers / visitors"
