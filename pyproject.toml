[project]
name = "ai-platform"
version = "0.1.0"
description = "Health Products Enterprise AI Platform - Governance Layer for 20+ Agents"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "redis>=5.2",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "structlog>=24.4",
  # 飞书
  "lark-oapi>=1.4",
  # AgentScope (锁版本)
  # "agentscope==1.0.0",
  # 可观测
  "langfuse>=2.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
]
langgraph = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ASYNC"]
