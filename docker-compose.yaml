version: "3.9"

services:
  # ============================================================
  # AI 中台 API 服务
  # ============================================================
  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app/ontology/definitions:/app/app/ontology/definitions
    environment:
      - DATABASE_URL=mysql+asyncmy://zhongtai:zhongtai123@mysql:3306/ai_zhongtai
      - REDIS_URL=redis://redis:6379/0

  # ============================================================
  # MySQL — 业务数据库（Skill 执行日志、经验 Pattern）
  # ============================================================
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ai_zhongtai
      MYSQL_USER: zhongtai
      MYSQL_PASSWORD: zhongtai123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Redis — 会话记忆、经验缓存、飞书去重、限流
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Neo4j — 知识图谱（本体关系、经验时序图谱）
  # ============================================================
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"  # Web UI
      - "7687:7687"  # Bolt 协议
    environment:
      NEO4J_AUTH: neo4j/zhongtai123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
