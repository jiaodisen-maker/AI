# Agentic Insight 单 80 入口反向代理
# 把 / 转 Next.js (3000)，把 /api/ 转 FastAPI (8000)，把 /metrics 转 FastAPI（Prometheus 抓取）

upstream agentic_api {
    server 127.0.0.1:8000;
}
upstream agentic_web {
    server 127.0.0.1:3000;
}

# 内部团队 IP 白名单（在 /etc/nginx/conf.d/team_ips.conf 维护）
# 示例：
#   geo $team_allowed { default 0; 1.2.3.4 1; 5.6.7.0/24 1; }
geo $team_allowed {
    default 1;     # 阶段 1 默认全开（团队自己用）；上线前改默认 0 + 白名单
}

server {
    listen 80 default_server;
    server_name _;

    # 内部团队限制（阶段 1 默认全开，留参数）
    if ($team_allowed = 0) {
        return 403;
    }

    client_max_body_size 50m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    # 健康检查（不要求白名单）
    location = /health {
        proxy_pass http://agentic_api/health;
        access_log off;
    }

    # Prometheus 抓取（仅本机访问）
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;        # docker network
        deny all;
        proxy_pass http://agentic_api/metrics;
        access_log off;
    }

    # API 路径
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://agentic_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其它走 Next.js
    location / {
        proxy_pass http://agentic_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
