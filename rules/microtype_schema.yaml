# microtype 5 维 schema（保健品赛道 v0.1）
#
# 责任：架构师 + 内容主理共同定义。任何修改需季度审。
# 加载时机：A6 Microtype Agent 启动时一次性加载。
# 正交性约束：5 维互不重叠，组合空间 ≈ scenes×audiences×ingredients×emotions×restrictions
# seed_combinations 给出 50 个高频组合，用于 A6 在没有命中时的 candidate 提案锚点。

version: "0.1"
last_reviewed_at: null
last_reviewed_by: null

# ============================================================
# 维度 1：场景 (scene) — 内容发生的时空 / 生活场景
# ============================================================
scenes:
  - id: morning           # 晨起
  - id: commute           # 通勤
  - id: office            # 办公室
  - id: post_meal         # 餐后
  - id: late_night        # 熬夜
  - id: workout           # 健身 / 运动
  - id: pre_sleep         # 睡前
  - id: parenting         # 亲子 / 育儿
  - id: business_dinner   # 应酬 / 饭局
  - id: travel            # 出差 / 旅行
  - id: family_care       # 照顾父母 / 长辈
  - id: post_drinking     # 酒后
  - id: weight_loss       # 减肥 / 控糖期
  - id: post_illness      # 病后恢复（合规边界，标谨慎）
  - id: seasonal          # 换季

# ============================================================
# 维度 2：人群 (audience) — 内容对话的对象
# ============================================================
audiences:
  - id: white_collar_female      # 白领女性
  - id: white_collar_male        # 白领男性
  - id: late_night_workers       # 熬夜党
  - id: middle_aged              # 中年（35-50）
  - id: senior                   # 中老年（50+）
  - id: pregnant_postpartum      # 孕产（合规高风险）
  - id: students_exam            # 高考/考研学生
  - id: fitness_enthusiast       # 运动健身党
  - id: new_parents              # 新手爸妈
  - id: aging_parents_caretaker  # 照顾父母人群（关切型购买决策）
  - id: chronic_concern          # 三高担忧型（亚健康，未确诊）
  - id: female_beauty            # 美妆护肤交叉人群

# ============================================================
# 维度 3：成分 (ingredient) — 主推 SKU 类目
# ============================================================
ingredients:
  - id: glucosamine          # 氨糖软骨素
  - id: collagen             # 胶原蛋白
  - id: probiotics           # 益生菌
  - id: lutein               # 叶黄素
  - id: omega3               # 深海鱼油 Omega3
  - id: vitamin_b            # 维生素 B 族
  - id: vitamin_d            # 维生素 D
  - id: vitamin_c            # 维生素 C
  - id: liver_protect        # 护肝片（奶蓟草等）
  - id: melatonin            # 褪黑素
  - id: enzyme               # 酵素
  - id: calcium              # 钙片
  - id: iron_folic           # 铁 + 叶酸
  - id: coq10                # 辅酶 Q10
  - id: nmn                  # NMN（合规边界，标谨慎）
  - id: dietary_fiber        # 膳食纤维
  - id: protein_powder       # 蛋白粉
  - id: ginseng              # 人参 / 西洋参（中药交叉）
  - id: hyaluronic_acid      # 玻尿酸口服
  - id: meal_replacement     # 代餐

# ============================================================
# 维度 4：情绪 (emotion) — 内容驱动的核心情绪
# ============================================================
emotions:
  - id: anxiety            # 焦虑
  - id: fatigue            # 疲惫
  - id: guilt              # 愧疚（特别是父母 / 育儿场景）
  - id: fear               # 恐惧（健康损失）
  - id: aspiration         # 向往（理想状态）
  - id: belonging          # 归属（同人群共鸣）
  - id: nostalgia          # 怀旧（情怀型种草）
  - id: empowerment        # 赋能 / 掌控感

# ============================================================
# 维度 5：限制 (restriction) — 合规等级 / 平台 / 达人形态
# ============================================================
restrictions:
  - id: green_safe         # 合规绿色 — 任何账号可发
  - id: yellow_caution     # 合规黄色 — 需广审号 / 蓝词库过审
  - id: platform_douyin    # 抖音特定限制
  - id: platform_xhs       # 小红书特定限制
  - id: kol_real_person    # 真人达人（出镜型）
  - id: kol_doctor         # 医生 / 营养师人设（合规高门槛）
  - id: brand_owned        # 品牌自营号（更宽松）

# ============================================================
# Seed 50 高频组合（A6 candidate 提案锚点）
# 格式：scene/audience/ingredient/emotion/restriction
# ============================================================
